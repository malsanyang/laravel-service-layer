name: Bug report
description: Report reproducible behaviour in Laravel Service Layer that appears to be incorrect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to help improve Laravel Service Layer.

        Do not use this form for security vulnerabilities. Follow the repository's security policy and report them privately instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the problem and its impact.
      placeholder: What happened?
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Provide the installed package version or commit SHA.
      placeholder: v1.0.0 or abc1234
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 8.3.0
    validations:
      required: true

  - type: dropdown
    id: laravel-version
    attributes:
      label: Laravel version
      options:
        - Laravel 12
        - Laravel 13
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest code sample or repository that reproduces the problem.
      placeholder: Include the relevant service, contract, service-layer configuration, Artisan command, and steps needed to reproduce the problem.
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual-behaviour
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or exception trace
      description: Remove credentials, personal data, and other sensitive information.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched the existing issues for duplicates.
          required: true
        - label: I reproduced the problem with the latest available version or the current `main` branch.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
